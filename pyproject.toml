[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veracium"
version = "0.28.0"
description = "Provenance-aware memory for AI agents."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Quentin Spencer" }]
keywords = ["agent", "memory", "llm", "provenance", "mcp", "rag"]
dependencies = [
    "pydantic>=2.12",  # the lowest pydantic with a CPython 3.14 wheel (pydantic-core); specs/0016 D1's 2.7 reason lapsed at D2
]

[project.urls]
Homepage = "https://github.com/veracium-ai/Veracium"
Repository = "https://github.com/veracium-ai/Veracium"
Issues = "https://github.com/veracium-ai/Veracium/issues"

# Core is embedded and BYO-LLM: no database, no bundled model client.
# Optional extras add a reference LLM provider and the MCP server.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0,<2"]   # the server imports FastMCP's 1.x surface; 2.x broke it (amendments round 1)
dev = ["pytest>=8", "pytest-randomly>=3"]

[project.scripts]
veracium = "veracium.cli:main"
veracium-mcp = "veracium.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veracium"]

# The sdist is the whole repo, and hatchling honours `.gitignore` but NOT
# `.git/info/exclude` — so a file kept out of the repo by the LOCAL exclude
# list still lands in the published tarball. `CLAUDE.md` is exactly that: it
# is internal multi-session workflow, deliberately untracked, and it was on
# its way to PyPI, where a release cannot be withdrawn and re-cut.
# ⚠️ 2026-10-09: it had already reached PyPI, in the 0.1.2–0.15.0 sdists (33
# of them; found by downloading every published artifact, with no secrets in
# the five versions of the file). The owner's ruling, reaffirmed for that
# full range: left as-is. This exclude applies from 0.16.0. `.claude/` is
# excluded whole since 221ed83.
#
# Keep this list in step with `.git/info/exclude` —
# `test_the_sdist_excludes_every_locally_excluded_file` fails if they drift.
[tool.hatch.build.targets.sdist]
exclude = [
  ".claude/",
  "CLAUDE.md",
]
