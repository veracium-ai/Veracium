name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Lane split (2026-11-07, measured on a branch first, on the owner's word): the suite runs as five single-process,
    # random-order shards. Each shard collects the whole suite and runs its share of modules, assigned by
    # .github/ci_shard.py from the capture's per-module times; shard-check below proves the shares partition the
    # collection. Cost: modules in different shards never interleave in one process.
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: specs/render_index.py derives every spec's `updated`
          # column from `git log -1` on the file, and the STATUS gate compares
          # the committed index against a fresh render. A depth-1 clone has no
          # history for files the HEAD commit did not touch, so the render
          # could never match — 63 consecutive red runs before anyone looked.
          # (This change shipped without its Process-Change trailer and the
          # spec-reference gate failed that push — correctly. Trailer carried
          # by the follow-up commit that added this note.)
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run tests
        # TMPDIR on the RUNNER's filesystem (2026-10-28): runs 40601278498 and 40627846765 drew ubuntu-26.04 image
        # 20261012.163.1, where /tmp is another filesystem, and 0026's bootstrap test (it hard-links a fixture into
        # tmp_path) refused with EXDEV, as its own message prescribes; 55af957's run drew 20261025.179.1 and passed.
        # TMPDIR, not --basetemp: the closure-evidence row re-runs that test in a nested pytest, which inherits the
        # environment but not the option, and a shared --basetemp would be cleared by the inner session. Each
        # session still gets its own numbered pytest-of-<user> directory under $RUNNER_TEMP, outside the package tree.
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONPATH: .github
          VERACIUM_CI_SHARD: ${{ matrix.shard }}/5
          VERACIUM_CI_SHARD_REPORT: ${{ runner.temp }}/shard-report.json
        run: pytest -q -p ci_shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-report-py${{ matrix.python-version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error
        # The live LLM acceptance eval is opt-in (VERACIUM_EVAL=1) and needs a
        # provider + key, so it stays skipped here; the offline suite is the gate.

  min-deps:
    # specs/0016 D1 (R6-4): a REAL minimum-dependency job — pydantic pinned to
    # the declared floor. The floor is 2.12.0 from the Python 3.14 floor
    # (2026-09-27): no pydantic-core wheel exists for 3.14 below it. D1's own
    # reason for 2.7 (Field(deprecated=...), R5-3) lapsed at D2, which removed
    # its only consumer. tests/test_dependency_floor.py asserts the installed
    # version equals the floor pyproject.toml declares, so this job cannot
    # silently "pass" on another version; the whole suite also runs here so
    # the floor is a supported configuration, not a marketing claim.
    name: pytest (pydantic floor, ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install with the pinned floor
        # CORE floor only: the [mcp] extra's own dependencies require a newer
        # pydantic (their resolver enforces it for mcp users), so the floor
        # claim is scoped to the core library; the one MCP test is
        # importorskip-gated and skips cleanly here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pydantic==2.12.0"
      - name: Run tests at the floor
        env:
          VERACIUM_MIN_DEP_JOB: "1"
          TMPDIR: ${{ runner.temp }}          # the same, see "Run tests" above
          PYTHONPATH: .github
          VERACIUM_CI_SHARD: ${{ matrix.shard }}/5
          VERACIUM_CI_SHARD_REPORT: ${{ runner.temp }}/shard-report.json
        run: pytest -q -p ci_shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-report-floor-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error

  shard-check:
    # Refuses unless, for each lane, all five shards collected the same suite and computed the same assignment, their
    # selections are disjoint, and their union is the whole collection: a share lost to a bad assignment cannot pass.
    name: shards cover the suite once
    needs: [test, min-deps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-report-*
          path: reports
      - name: Check each lane's shards partition its collection
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          lanes = {}
          for p in sorted(pathlib.Path("reports").glob("shard-report-*/shard-report.json")):
              lane = p.parent.name.rsplit("-", 1)[0]
              lanes.setdefault(lane, []).append(json.loads(p.read_text()))
          bad = []
          if sorted(lanes) != ["shard-report-floor", "shard-report-py3.14"]:
              bad.append(f"lanes {sorted(lanes)}")
          for lane, rs in sorted(lanes.items()):
              ks = sorted(r["shard"] for r in rs)
              if ks != [1, 2, 3, 4, 5] or {r["of"] for r in rs} != {5}:
                  bad.append(f"{lane}: shards {ks}")
              for key in ("collected", "collected_sha256", "assignment_sha256"):
                  if len({r[key] for r in rs}) != 1:
                      bad.append(f"{lane}: shards disagree on {key}")
              sel = [i for r in rs for i in r["selected"]]
              if len(sel) != len(set(sel)):
                  bad.append(f"{lane}: {len(sel) - len(set(sel))} node(s) selected twice")
              if len(set(sel)) != rs[0]["collected"]:
                  bad.append(f"{lane}: {len(set(sel))} selected of {rs[0]['collected']} collected")
              print(f"{lane}: {len(rs)} shards, {len(set(sel))} of {rs[0]['collected']} nodes, each once; "
                    + ", ".join(f"{r['shard']}:{len(r['selected'])}" for r in sorted(rs, key=lambda r: r["shard"])))
          if bad:
              print("REFUSED:", *bad, sep="\n  ")
              sys.exit(1)
          PY

  build:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build distribution and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  spec-reference:
    name: spec reference on trust-surface changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Check for Spec: trailers"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            # First push or force-push: there is no meaningful base. Check the
            # tip commit alone rather than skipping — the previous version
            # exited 0 here, which is the same fail-open defect the script had.
            echo "no usable base (first push or force-push); checking the tip commit only"
            RANGE="${{ github.sha }}^!"
          fi
          echo "checking $RANGE"
          python3 specs/check_spec_reference.py "$RANGE"
