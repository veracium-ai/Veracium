name: container

# specs/0054 §6: the container image's checks, I1–I8, on every push. Build and test only: this workflow never pushes
# an image. A release pushes the digest its own gated build produced, on the owner's word (0054 §4a), from the release
# runbook, not from here. The amd64 and arm64 images are built natively, each on its own runner, never by emulation
# (§5); the RED matrix (every wrong image of §6's RED column, refused as named) runs on amd64.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the wheel builder and the handshake client
        # the MCP SDK runs on the runner only, as the handshake's client; the image installs from its own lock
        run: |
          python -m pip install --upgrade pip
          pip install build -e ".[mcp]"
      - name: Build the wheel from the checkout
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
      - name: Build the image (the attested gate refuses an unattested SQLite build, I2)
        run: python container/check_image.py build --wheel "$RUNNER_TEMP"/dist/veracium-*.whl --tag veracium-ci
      - name: I1–I8
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python container/check_image.py check --image veracium-ci --version "$version"
      - name: The RED matrix (each wrong image refused as §6 names)
        if: matrix.arch == 'amd64'
        run: python container/check_image.py red --wheel "$RUNNER_TEMP"/dist/veracium-*.whl
