# worse than none:
#
#   * PLATFORM-PINNED. `pydantic_core` is a compiled wheel — the file here is
#     cp314 / manylinux_2_17_x86_64. On any other Python minor version or
#     platform, pip will not use it and offline install FAILS CLOSED rather
#     than resolving something else.
#   * TEST DEPENDENCIES ONLY. The product itself needs `pydantic>=2.7` and
#     nothing else (pyproject). `mcp` and `anthropic` are OPTIONAL extras and
